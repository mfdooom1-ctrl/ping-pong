<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#100d26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="An original neon table-tennis arcade. Twelve cities. Two mustaches. One underground world tour. Play offline."
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/icon-192.png" />
    <title>SPIN CITY — PING-PONG</title>
  </head>
  <body>
    <div id="app">
      <div id="game" aria-label="Spin City table tennis court"></div>
      <main id="ui"></main>
      <div id="rotate">
        <div class="rotate-icon">↻</div>
        <h1>TURN UP THE CITY.</h1>
        <p>Rotate your phone for the full arcade.</p>
        <span>SPIN CITY / PING-PONG</span>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="boot">SPIN CITY<span>WARMING UP THE NEON…</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
